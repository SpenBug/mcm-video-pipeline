<svg viewBox="0 0 980 620" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
<title>模板选型决策树</title>
<desc>先判断内容能否用编号加一句话表达，能则用 T2，不能则按主体类型选 T1、T3、T4、T5，最后都叠加 T6 封面与竖版适配。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="980" height="620" rx="16" fill="#FFFFFF"/>
<text x="40" y="34" font-size="20" font-weight="500" fill="#1A1A2E">模板选型决策树 · 6 套模板</text>

<polygon points="490,54 670,96 490,138 310,96" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="490" y="88" font-size="12.5" fill="#633806" text-anchor="middle" dominant-baseline="central">内容能不能用</text>
<text x="490" y="105" font-size="12.5" fill="#633806" text-anchor="middle" dominant-baseline="central">「编号 + 一句话」表达?</text>

<path d="M310 96 L176 188" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="212" y="132" font-size="11.5" fill="#0F6E56" text-anchor="middle">能 · 条数 ≤ 10</text>

<path d="M490 138 L490 176" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="504" y="160" font-size="11.5" fill="#5F5E5A">不能</text>

<rect x="55" y="192" width="230" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.9"/>
<text x="170" y="212" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">T2 大字清单档</text>
<text x="170" y="232" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">110–120s · 单版式 · 三档语气</text>

<polygon points="490,180 610,220 490,260 370,220" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="490" y="220" font-size="12.5" fill="#633806" text-anchor="middle" dominant-baseline="central">主体是什么?</text>

<text x="205" y="336" font-size="11" fill="#888780" text-anchor="middle">方法对比 / 评分细则</text>
<text x="415" y="336" font-size="11" fill="#888780" text-anchor="middle">一道真题</text>
<text x="625" y="336" font-size="11" fill="#888780" text-anchor="middle">论文图讲解</text>
<text x="835" y="336" font-size="11" fill="#888780" text-anchor="middle">赛事资讯</text>

<path d="M490 260 L205 346" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M490 260 L415 346" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M490 260 L625 346" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M490 260 L835 346" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>

<rect x="115" y="350" width="180" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
<text x="205" y="374" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">T1 信息密度档</text>
<text x="205" y="394" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">185–195s · 7 版式</text>

<rect x="325" y="350" width="180" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
<text x="415" y="374" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">T3 真题长拆解档</text>
<text x="415" y="394" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">240–320s · 只出横版</text>

<rect x="535" y="350" width="180" height="64" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.9"/>
<text x="625" y="374" font-size="13" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">T4 奶油论文图解档</text>
<text x="625" y="394" font-size="11" fill="#993C1D" text-anchor="middle" dominant-baseline="central">220–260s · 浅色</text>

<rect x="745" y="350" width="180" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
<text x="835" y="374" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">T5 资讯快报档</text>
<text x="835" y="394" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">180–200s · 10 版式</text>

<path d="M75 248 L75 465" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M205 414 L205 465" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M415 414 L415 465" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M625 414 L625 465" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M835 414 L835 465" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M75 465 L835 465" fill="none" stroke="#888780" stroke-width="1.3"/>
<path d="M490 465 L490 472" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="320" y="476" width="340" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.9"/>
<text x="490" y="496" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">T6 封面与竖版适配（叠加档）</text>
<text x="490" y="516" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">任意一档都要过一遍封面规格 + 竖版 8 项清单</text>

<text x="490" y="570" font-size="12" fill="#5F5E5A" text-anchor="middle">时长反向选档：&lt; 2 分钟 → T2　｜　2–3 分钟 → T5 或 T1 压到 185s　｜　3–4 分钟 → T4　｜　4–6 分钟 → T3</text>
<text x="490" y="596" font-size="12" fill="#888780" text-anchor="middle">一句话记忆：能用「编号 + 一句话」表达 → T2；不能 → T1。真题 → T3，图讲解 → T4，资讯 → T5。</text>
</svg>
